; VBACKUP savesets for the MultiArc plugin of Far: far2l (Linux) and Far3 (Windows).
; Read only: list, extract, test.  The listing comes from the catalog of the saveset,
; so a large one opens at once.  vbkx - the stand-alone extractor of VBACKUP - does
; the work; on Windows it is vbkx.exe, found on PATH.
;
; far2l:  append to ~/.config/far2l/plugins/multiarc/custom.ini
; Far3:   append to the custom.ini of MultiArc (Plugins\MultiArc\Formats\custom.ini)
;
; StarLet Squad and Ruslan R. Laishev (AKA: BadAss SysMan), 4-OCT-2026, X-01
[VBACKUP]
TypeName=VBACKUP
ID=56 42 4B 42
IDPos=0
Extension=bck
List=vbkx l %%AQ -m
Format0=yyyy-tt-dd hh:mm:ss zzzzzzzzzzzz aaaaa nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
Extract=vbkx x %%AQ -f %%FSQ
ExtractWithoutPath=vbkx x %%AQ -f -j %%FSQ
Test=vbkx t %%AQ
Delete=
Add=
AllFilesMask="*"
